<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .card {
        width: 300px;
        height: 400px;
        background-color: #1a1a1a; /* 기본 검은색 배경 */
        border-radius: 20px;
        position: relative; /* 가상 요소의 기준점 */
        overflow: hidden; /* 원이 카드 밖으로 나가지 않게 설정 */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        transition: transform 0.3s ease;
        cursor: pointer;
        z-index: 1;
      }

      /* 두 원의 공통 스타일 */
      .card::before,
      .card::after {
        content: "";
        position: absolute;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        filter: blur(50px); /* 블러 처리 */
        opacity: 0; /* 처음에는 숨김 */
        transition: opacity 0.5s ease;
        z-index: -1; /* 텍스트 뒤로 보냄 */
      }

      /* 첫 번째 원 (왼쪽 상단) */
      .card::before {
        top: -20px;
        left: -20px;
        background: rgba(255, 0, 150, 0.6); /* 분홍색 계열 */
      }

      /* 두 번째 원 (오른쪽 하단) */
      .card::after {
        bottom: -20px;
        right: -20px;
        background: rgba(0, 200, 255, 0.6); /* 하늘색 계열 */
      }

      /* 마우스 호버 시 효과 */
      .card:hover::before,
      .card:hover::after {
        opacity: 1; /* 블러 이미지가 서서히 나타남 */
      }

      .card:hover {
        transform: translateY(-10px); /* 선택사항: 살짝 위로 이동하는 효과 */
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h3>Glowing Card</h3>
      <p>마우스를 올려보세요!</p>
    </div>
    <div
      class="group relative w-72 h-96 bg-[#1a1a1a] rounded-2xl overflow-hidden before:content-[''] before:absolute before:-top-10 before:-left-10 before:w-40 before:h-40 before:bg-pink-500 before:rounded-full before:blur-[50px] before:opacity-0 before:transition-opacity before:duration-500 hover:before:opacity-60 after:content-[''] after:absolute after:-bottom-10 after:right-10 after:w-40 after:h-40 after:bg-cyan-500 after:rounded-full after:blur-[50px] after:opacity-0 after:transition-opacity after:duration-500 hover:after:opacity-60"
    >
      <!-- 콘텐츠만 남음 -->
      <h3 class="relative z-10 text-white">Clean Version</h3>
    </div>
  </body>
</html>
